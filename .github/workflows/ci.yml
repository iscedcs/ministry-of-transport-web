# CI Pipeline — Ministry of Transport Platform
# Reference: docs/IMPLEMENTATION_PLAN.md — STORY-010
#
# Runs on:
#   - Every push to main (build + lint + type-check)
#   - Every pull request targeting main (lint + type-check only; build is slow)
#
# Environment variables:
#   DATABASE_URL  — Required for Prisma to generate client (set in repo secrets)
#   SESSION_SECRET — Required for TypeScript to resolve lib/session.ts (set in repo secrets)
#
# Notes:
#   - pnpm is used as the package manager (pnpm-workspace.yaml present)
#   - Prisma client must be generated before tsc/next build can succeed
#   - next build runs a full production build which catches page-level type errors

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Placeholder DATABASE_URL so prisma generate works without a real DB
  DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://placeholder:placeholder@localhost:5432/mot' }}
  SESSION_SECRET: ${{ secrets.SESSION_SECRET || 'ci-placeholder-secret-32-chars-min' }}
  NEXT_PUBLIC_APP_URL: "https://mot.example.com"
  NODE_ENV: test

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint & Type-check
  # Fastest feedback — runs on every PR commit
  # ─────────────────────────────────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Run ESLint
        run: pnpm lint

      - name: Run TypeScript compiler check
        run: pnpm tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Build check
  # Only runs on pushes to main (not on every PR commit — too slow)
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run build job on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint-typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Build Next.js app
        run: pnpm build
        env:
          # Silence telemetry
          NEXT_TELEMETRY_DISABLED: "1"
